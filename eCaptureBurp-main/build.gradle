plugins {
    id 'java'

    // 添加这一行，注意版本号可能需要根据你的 Gradle 版本调整，这里用最新版示例
    id 'com.github.johnrengelman.shadow' version '8.1.1'

}

group = 'com.ecapture.burp'
version = '1.0.0'


java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    maven { url "https://maven.aliyun.com/repository/gradle-plugin" }
    maven { url "https://maven.aliyun.com/repository/public" }
    maven { url "https://maven.aliyun.com/repository/central" }
    mavenCentral()
}

dependencies {
    // Burp Suite Montoya API
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2023.12.1'
    
    // WebSocket client
    implementation 'org.java-websocket:Java-WebSocket:1.5.6'
    
    // Protobuf runtime (for parsing)
    implementation 'com.google.protobuf:protobuf-java:4.28.2'
}

shadowJar {
    archiveClassifier.set('all')
}


jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    
    manifest {
        attributes(
            'Implementation-Title': 'eCapture Burp Extension',
            'Implementation-Version': version
        )
    }
    
    archiveBaseName = 'ecapture-burp-extension'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
